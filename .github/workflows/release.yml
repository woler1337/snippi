name: Release

# Триггеры:
#   • push тега v* (например v1.0.2) — основной флоу релиза
#   • workflow_dispatch — запуск руками через UI «Actions» (полезно когда
#     релиз залип и нужно перезапустить только Windows)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Нужно чтобы джоба могла создавать релизы в репо.
# secrets.GITHUB_TOKEN — автоматически подставляется GitHub'ом, отдельно
# создавать ничего не нужно.
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Не останавливаем все джобы если упала одна — иначе релиз для других
      # платформ тоже не выйдет.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Зависимости ────────────────────────────────────────────────
      # npm ci быстрее и строже npm install. postinstall в package.json
      # вызывает `electron-builder install-app-deps`, который пересоберёт
      # uiohook-napi под нужную ОС/arch автоматически.
      - name: Install dependencies
        run: npm ci

      # ── Сборка под текущую ОС + publish в GitHub Releases ──────────
      # GH_TOKEN читается electron-builder'ом для загрузки артефактов.
      # Используем встроенный secrets.GITHUB_TOKEN — у него уже есть права
      # на текущий репозиторий, отдельных PAT'ов не нужно.
      - name: Build & publish (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # build:mac уже включает компиляцию Swift-хелперов (key-helper, ocr-helper)
        # через scripts/build-helper.sh — на macOS runner'е есть swiftc.
        run: npm run build:mac -- --publish always

      - name: Build & publish (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win -- --publish always

      # ── Артефакты (на случай если publish упадёт — DMG/EXE доступны
      # для скачивания со страницы Actions Run в течение 7 дней) ──────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snippi-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore
          retention-days: 7
