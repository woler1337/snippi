appId: com.snippi.app
productName: Snippi
copyright: Copyright © 2024 Snippi

directories:
  output: dist

# ── Авто-обновления через GitHub Releases ────────────────────────────────
# Фид latest-mac.yml / latest.yml кладётся в Release-assets
# и читается electron-updater'ом при запуске. Электрон-билдер
# заливает их сам при `--publish always` (нужен GH_TOKEN с repo:public_repo).
publish:
  - provider: github
    owner: woler1337
    repo: snippi
    releaseType: release

# Файлы, которые войдут в сборку
files:
  - src/**/*
  - "!src/native/*.swift"      # swift-исходники не нужны в бандле
  - assets/tray-icon.png
  - assets/tray-icon@2x.png    # Retina для macOS menubar
  - package.json
  - "!**/*.map"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/.bin"

# tesseract.js на Windows запускает worker_threads из своего worker-script.
# Внутри asar путь к воркеру нестабилен между версиями Electron → распаковываем
# tesseract.js в app.asar.unpacked, чтобы Worker получил реальный файловый путь.
asarUnpack:
  - "**/node_modules/tesseract.js/**"

# macOS: Swift-хелперы кладём в Resources/ (доступны через process.resourcesPath)
extraResources:
  - from: src/native/key-helper
    to: key-helper
  - from: src/native/ocr-helper
    to: ocr-helper

# ── macOS ─────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [arm64, x64]         # один комплект DMG: и для Apple Silicon, и для Intel
  icon: assets/icon.png          # charcoal + светлая обводка — electron-builder конвертирует в .icns
  category: public.app-category.productivity
  hardenedRuntime: false         # без подписи — для локальной сборки
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: "Snippi"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Windows ───────────────────────────────────────────────────────────────
win:
  target:
    # NSIS-installer — поддерживает авто-обновления electron-updater
    # (portable target обновления НЕ поддерживает). latest.yml в релизе
    # указывает на этот installer.
    - target: nsis
      arch: [x64]
    # portable — один .exe без установки, для тех кто не хочет installer.
    # НЕ участвует в авто-обновлениях, но скачать и запустить можно.
    - target: portable
      arch: [x64]
  icon: assets/icon-win.png      # чистый тёмный фон без обводки — для taskbar

# NSIS: не one-click — даём пользователю выбрать папку и создать ярлыки.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false              # установка для текущего пользователя (без UAC)
  createDesktopShortcut: true
  createStartMenuShortcut: true
